name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG from Prakhyat05 GitHub Contributions
        uses: Platane/snk@v3
        with:
          github_user_name: Prakhyat05
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#071a12,#0a3d24,#10b981,#34d399,#6ee7b7
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#071a12,#0a3d24,#10b981,#34d399,#6ee7b7

      - name: Commit and Push Updated Snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg || true
          git commit -m "chore: live sync 365-day contribution snake [skip ci]" || exit 0
          git push origin main
