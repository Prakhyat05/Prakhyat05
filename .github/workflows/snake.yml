name: Generate Contribution Snake

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Raw Snake SVG from GitHub Contributions
        uses: Platane/snk@v3
        with:
          github_user_name: Prakhyat05
          outputs: |
            assets/snake-raw.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#071a12,#0a3d24,#10b981,#34d399,#6ee7b7

      - name: Wrap Snake with Live Contribution Telemetry
        run: |
          python scripts/build_snake.py
          rm -f assets/snake-raw.svg

      - name: Commit and Push Updated Snake SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg
          git diff --staged --quiet || (git commit -m "chore: live sync 365-day contribution snake & stats [skip ci]" && git push origin main)
